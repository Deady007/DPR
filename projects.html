<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Projects — Shreemay</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function renderRows(filter = "") {
  const list = DB.projects.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()));
  if (!list.length) return `<tr><td colspan="3" class="muted" style="text-align:center;padding:30px">No projects found.</td></tr>`;
  return list.map(p => `
    <tr onclick="go('project.html?id=${p.id}')">
      <td class="cell-title">${p.name}</td>
      <td>${p.client}</td>
      <td>${p.status}</td>
    </tr>`).join('');
}

const content = `
<main class="screen">
  <input class="search boxed" id="projSearch" placeholder="Search by project name...">
  <table class="dtable center" style="margin-top:18px">
    <thead><tr><th>Project</th><th>Client</th><th>Status</th></tr></thead>
    <tbody id="projBody">${renderRows()}</tbody>
  </table>
  <div class="pager">
    <button class="btn btn-primary">Previous</button>
    <span class="page-info">Page 1 of 1</span>
    <button class="btn btn-primary">Next</button>
  </div>
</main>`;

mountShell(content, { title: 'MyProjects' });
document.getElementById('projSearch').addEventListener('input', (e) => {
  document.getElementById('projBody').innerHTML = renderRows(e.target.value);
});
</script>
</body>
</html>
