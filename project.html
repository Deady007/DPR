<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Project — Shreemay</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app" id="app">

  <!-- APP BAR -->
  <header class="appbar" id="appBar">
    <button class="icon-btn" onclick="history.back()" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <h1 id="projTitle">DPR</h1>
    <button class="icon-btn" onclick="openProjectDrawer()" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="26" height="26">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </header>

  <!-- PROJECT SIDEBAR DRAWER -->
  <div class="overlay" id="projectDrawer" onclick="if(event.target===this)closeProjectDrawer()">
    <nav class="drawer project-drawer" role="navigation">

      <div class="pd-head">
        <div class="pd-project-name" id="pdProjectName">—</div>
        <div class="pd-sub">Select a section</div>
      </div>

      <div class="pd-item" data-tab="dpr" onclick="switchTab('dpr')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="24" height="24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        DPR
      </div>

      <div class="pd-item" data-tab="document" onclick="switchTab('document')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><path d="M16 16l-4-4-4 4"/><path d="M12 12v9"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
        Document
      </div>

      <div class="pd-item" data-tab="sop" onclick="switchTab('sop')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        SOP
      </div>

      <div class="pd-item" data-tab="query" onclick="switchTab('query')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Query
      </div>

      <div class="pd-item" data-tab="po" onclick="switchTab('po')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Materials
      </div>

      <div class="pd-item" data-tab="pendingWorks" onclick="switchTab('pendingWorks')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Pending Work
      </div>

    </nav>
  </div>

  <!-- MAIN CONTENT -->
  <main class="screen" id="tabContent"></main>

  <!-- ===== SHARED OVERLAYS ===== -->

  <!-- SIGNATURE PAD -->
  <div class="overlay" id="signOverlay" onclick="if(event.target===this)closeOverlay('signOverlay')">
    <div class="dialog" style="max-width:400px">
      <h3 id="signTitle">Sign</h3>
      <div class="sig-pad-wrap">
        <canvas class="sig-pad" id="sigCanvas"></canvas>
      </div>
      <div class="sig-actions" style="margin-top:16px">
        <button class="btn btn-danger" onclick="clearSig()">Clear</button>
        <button class="btn btn-primary" onclick="saveSig()">Save</button>
      </div>
      <button class="btn btn-light btn-block sig-cancel" onclick="closeOverlay('signOverlay')">Cancel</button>
    </div>
  </div>

  <!-- CREATE FOLDER MODAL -->
  <div class="overlay" id="createFolder" onclick="if(event.target===this)closeOverlay('createFolder')">
    <div class="dialog">
      <h3>Create New Folder</h3>
      <div class="field">
        <label>Folder Name <span class="req">*</span></label>
        <input class="input" id="folderName" placeholder="Enter folder name">
      </div>
      <div class="form-actions">
        <button class="btn btn-light" onclick="closeOverlay('createFolder')">Cancel</button>
        <button class="btn btn-primary" onclick="createFolder()">Create</button>
      </div>
    </div>
  </div>

  <!-- ADD SOP MODAL -->
  <div class="overlay" id="addSopOverlay" onclick="if(event.target===this)closeOverlay('addSopOverlay')">
    <div class="dialog" style="max-height:85vh;overflow-y:auto">
      <h3>Add SOP</h3>
      <div class="field">
        <label>Date <span class="req">*</span></label>
        <div class="pseudo-input select-look" id="sopDateBtn" onclick="pickSopDate()">
          <span id="sopDateVal" class="ph">Select date</span>
        </div>
      </div>
      <div class="field">
        <label>Structure <span class="req">*</span></label>
        <div class="pseudo-input select-look" onclick="openOverlay('structurePicker')">
          <span id="sopStructureVal" class="ph">Select Structure</span>
        </div>
      </div>
      <div class="field">
        <label>Agencies <span class="req">*</span></label>
        <div class="pseudo-input select-look" onclick="openOverlay('agencyPicker')">
          <span id="sopAgencyVal" class="ph">Select Agencies</span>
        </div>
      </div>
      <div class="hint" id="sopAutoNum"></div>
      <div class="form-actions">
        <button class="btn btn-light" onclick="closeOverlay('addSopOverlay')">Cancel</button>
        <button class="btn btn-primary" onclick="saveNewSop()">Save</button>
      </div>
    </div>
  </div>

  <!-- STRUCTURE PICKER -->
  <div class="overlay" id="structurePicker" onclick="if(event.target===this)closeOverlay('structurePicker')">
    <div class="sheet" style="max-height:60%">
      <h3>Select Structure</h3>
      <div id="structureList"></div>
    </div>
  </div>

  <!-- AGENCY MULTI-PICKER -->
  <div class="overlay" id="agencyPicker" onclick="if(event.target===this)closeOverlay('agencyPicker')">
    <div class="sheet" style="max-height:70%">
      <h3>Select Agencies</h3>
      <div id="agencyList"></div>
      <button class="btn btn-primary btn-block" style="margin-top:16px" id="agencyDoneBtn" onclick="agencyDone()">Done (0 selected)</button>
    </div>
  </div>

  <!-- GESTURE BAR -->
  <div class="navbar-gesture"></div>

</div><!-- .app -->

<!-- Scripts (order matters) -->
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/tab-dpr.js"></script>
<script src="js/tab-doc.js"></script>
<script src="js/tab-sop.js"></script>
<script src="js/tab-query.js"></script>
<script src="js/tab-po.js"></script>
<script src="js/tab-pending.js"></script>
<script>
/* =========================================================
   PROJECT SHELL — init, tab switching, shared functions
   ========================================================= */

const _pid    = qp('id', 'demo');
const project = DB.getProject(_pid);
const pdata   = DB.getProjectData(_pid);

/* Friendly label for each tab (used in appbar title) */
const TAB_LABELS = {
  dpr:          'DPR',
  document:     'Document',
  sop:          'SOP',
  query:        'Query',
  po:           'Materials',
  pendingWorks: 'Pending Work',
};

/* Active tab */
const appState = { tab: qp('tab', 'dpr') };

/* --- Project drawer helpers --- */
function openProjectDrawer()  { document.getElementById('projectDrawer')?.classList.add('open'); }
function closeProjectDrawer() { document.getElementById('projectDrawer')?.classList.remove('open'); }

/* Seed project name into drawer header */
document.getElementById('pdProjectName').textContent = project.name;

/* --- Tab switching --- */
function switchTab(id) {
  appState.tab = id;
  closeProjectDrawer();
  /* reset each tab's internal view state */
  if (id === 'dpr')          dprState.view = 'list';
  if (id === 'document')     docState.view = 'list';
  if (id === 'sop')          sopState.view = 'list';
  if (id === 'query')        queryState.view = 'list';
  if (id === 'po')           poState.view = 'list';
  if (id === 'pendingWorks') { pendingState.view = 'list'; pendingState.filter = 'All'; }
  renderActiveTab();
}

function renderActiveTab() {
  /* update appbar title */
  document.getElementById('projTitle').textContent = TAB_LABELS[appState.tab] || '';
  /* highlight active drawer item */
  document.querySelectorAll('#projectDrawer .pd-item').forEach(item => {
    item.classList.toggle('active', item.dataset.tab === appState.tab);
  });
  /* render content */
  const el = document.getElementById('tabContent');
  switch (appState.tab) {
    case 'dpr':          el.innerHTML = renderDPR();      break;
    case 'document':     el.innerHTML = renderDocument(); break;
    case 'sop':          el.innerHTML = renderSOP();      break;
    case 'query':        el.innerHTML = renderQuery();    break;
    case 'po':           el.innerHTML = renderPO();       break;
    case 'pendingWorks': el.innerHTML = renderPending();  break;
  }
  /* post-render hooks */
  if (appState.tab === 'po') poPostRender();
}

/* --- Shared: signature pad --- */
let _sigPad = null, _sigCallback = null;
function openSign(title, onSave) {
  _sigCallback = onSave;
  document.getElementById('signTitle').textContent = 'Sign — ' + title;
  openOverlay('signOverlay');
  const canvas = document.getElementById('sigCanvas');
  _sigPad = SignaturePad(canvas);
}
function clearSig() { _sigPad?.clear(); }
function saveSig() {
  if (_sigPad?.isEmpty()) { toast('Please draw your signature'); return; }
  closeOverlay('signOverlay');
  toast('Signature saved');
  if (_sigCallback) _sigCallback();
  renderActiveTab();
}

/* --- Shared: create folder --- */
function createFolder() {
  const name = document.getElementById('folderName').value.trim();
  if (!name) { toast('Enter folder name'); return; }
  const today = fmtDMY(new Date());
  pdata.folders.push({ id: 'f' + Date.now(), name, date: today, files: [] });
  document.getElementById('folderName').value = '';
  closeOverlay('createFolder');
  renderActiveTab();
}

/* --- Shared: SOP structure/agency pickers --- */
const _sopDraft = { date: fmtDMY(new Date()), structure: '', agencies: [] };

function openAddSop() {
  _sopDraft.date = fmtDMY(new Date());
  _sopDraft.structure = '';
  _sopDraft.agencies = [];
  const nextNum = String(pdata.sop.length + 1).padStart(4, '0');
  document.getElementById('sopAutoNum').textContent = `SOP will be auto-numbered as SOP/${nextNum}`;
  document.getElementById('sopDateVal').textContent = _sopDraft.date;
  document.getElementById('sopDateVal').classList.remove('ph');
  document.getElementById('sopStructureVal').textContent = 'Select Structure';
  document.getElementById('sopStructureVal').classList.add('ph');
  document.getElementById('sopAgencyVal').textContent = 'Select Agencies';
  document.getElementById('sopAgencyVal').classList.add('ph');
  openOverlay('addSopOverlay');
  document.getElementById('structureList').innerHTML =
    DB.structures.map(s => `<div class="picker-row" onclick="selectStructure('${s}')">${s}</div>`).join('');
  renderAgencyPicker();
}

function pickSopDate() {
  showDatePicker(_sopDraft.date, v => {
    _sopDraft.date = v;
    document.getElementById('sopDateVal').textContent = v;
    document.getElementById('sopDateVal').classList.remove('ph');
  });
}

function selectStructure(s) {
  _sopDraft.structure = s;
  document.getElementById('sopStructureVal').textContent = s;
  document.getElementById('sopStructureVal').classList.remove('ph');
  closeOverlay('structurePicker');
}

function renderAgencyPicker() {
  const html = DB.agenciesMaster.map(a => {
    const sel = _sopDraft.agencies.includes(a.name);
    return `<div class="check-row ${sel ? 'checked' : ''}" onclick="toggleAgency('${a.name}',this)">
      <div class="check-box">${icon('check')}</div>
      ${a.name} (${a.code})
    </div>`;
  }).join('');
  document.getElementById('agencyList').innerHTML = html;
  updateAgencyDoneBtn();
}
function toggleAgency(name, row) {
  const idx = _sopDraft.agencies.indexOf(name);
  if (idx === -1) _sopDraft.agencies.push(name);
  else _sopDraft.agencies.splice(idx, 1);
  row.classList.toggle('checked');
  updateAgencyDoneBtn();
}
function updateAgencyDoneBtn() {
  document.getElementById('agencyDoneBtn').textContent = `Done (${_sopDraft.agencies.length} selected)`;
}
function agencyDone() {
  const val = _sopDraft.agencies.join(', ');
  const el  = document.getElementById('sopAgencyVal');
  if (val) { el.textContent = val; el.classList.remove('ph'); }
  closeOverlay('agencyPicker');
}
function saveNewSop() {
  if (!_sopDraft.structure) { toast('Please select structure'); return; }
  if (!_sopDraft.agencies.length) { toast('Please select at least one agency'); return; }
  const nextNum = String(pdata.sop.length + 1).padStart(4, '0');
  const id = `SOP/${nextNum}`;
  pdata.sop.push({
    id, date: _sopDraft.date, structure: _sopDraft.structure,
    agencies: [..._sopDraft.agencies],
    checkpoints: [], agencyList: _sopDraft.agencies.map(n => {
      const ag = DB.agenciesMaster.find(a => a.name === n);
      return { name: n, code: ag?.code || n.substring(0,4).toUpperCase(), signed: false };
    }),
  });
  closeOverlay('addSopOverlay');
  sopState.view = 'list';
  renderActiveTab();
  toast('SOP saved');
}

/* --- Share dropdown toggle --- */
function toggleMenu(id) {
  document.querySelectorAll('.menu').forEach(m => { if (m.id !== id) m.classList.remove('open'); });
  document.getElementById(id)?.classList.toggle('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('[onclick*="toggleMenu"]')) {
    document.querySelectorAll('.menu').forEach(m => m.classList.remove('open'));
  }
});

/* --- Helper: empty text --- */
function emptyText(msg) { return `<p class="empty-text">${msg}</p>`; }

/* --- Boot --- */
renderActiveTab();
</script>
</body>
</html>
